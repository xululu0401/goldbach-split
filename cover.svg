  <rect x="90" y="0" width="4" height="1200" fill="#e8a7a0"/>
  <text x="130" y="200" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="108" font-weight="800" fill="#1f2a3a">草稿纸上拆偶数</text>
  <text x="130" y="275" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="38" fill="#4b5566">随手一个偶数，拆成两个素数有几种办法</text>
  <text x="130" y="440" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="128" font-weight="800" fill="#1f2a3a">98 = 19 + 79</text>
  <text x="130" y="520" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="36" fill="#2d5f9a" font-weight="700">共 3 种 · 从 2 试到第 8 个素数才成</text>
  <text x="130" y="600" font-family="'SF Mono',Menlo,Consolas,monospace" font-size="38" font-weight="400" fill="#4b5566">98 − 2 = 96  = 2⁵ × 3  ✗</text><text x="130" y="656" font-family="'SF Mono',Menlo,Consolas,monospace" font-size="38" font-weight="400" fill="#4b5566">98 − 3 = 95  = 5 × 19  ✗</text><text x="130" y="712" font-family="'SF Mono',Menlo,Consolas,monospace" font-size="38" font-weight="400" fill="#4b5566">98 − 5 = 93  = 3 × 31  ✗</text><text x="130" y="768" font-family="'SF Mono',Menlo,Consolas,monospace" font-size="38" font-weight="400" fill="#4b5566">98 − 7 = 91  = 7 × 13  ✗</text><text x="130" y="824" font-family="'SF Mono',Menlo,Consolas,monospace" font-size="38" font-weight="400" fill="#4b5566">98 − 11 = 87  = 3 × 29  ✗</text><text x="130" y="880" font-family="'SF Mono',Menlo,Consolas,monospace" font-size="38" font-weight="400" fill="#4b5566">98 − 13 = 85  = 5 × 17  ✗</text><text x="130" y="936" font-family="'SF Mono',Menlo,Consolas,monospace" font-size="38" font-weight="400" fill="#4b5566">98 − 17 = 81  = 3⁴  ✗</text><rect x="110" y="952" width="980" height="54" fill="#fff2b3"/><text x="130" y="992" font-family="'SF Mono',Menlo,Consolas,monospace" font-size="38" font-weight="800" fill="#2b7a4b">98 − 19 = 79  素数 ✓</text>
  <text x="130" y="1130" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="26" fill="#858c98">哥德巴赫猜想尚未被证明；本页只对一个数验算</text>
